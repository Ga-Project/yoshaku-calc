<!-- OGP 画像（public/og.png・1200x630）の生成元。
     再生成（**macOS の Chrome で実行すること**・リポジトリルートから）:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
         --disable-gpu --hide-scrollbars --window-size=1200,630 \
         --force-device-scale-factor=1 --blink-settings=preferredColorScheme=1 \
         --screenshot=public/og.png "file://$PWD/tools/og-source.html"
     明朝（Hiragino Mincho ProN / Yu Mincho）は macOS 同梱フォント。Linux/CI で
     撮り直すと総称 serif に落ち、この製品の「藍と紙・明朝」の顔が黙って消える。
     preferredColorScheme=1 は headless が既定でダークになる罠の回避。

     ■ 構造: 画面そのものを「製図面」として扱う（図面枠＋表題欄）。
       一般的な OGP の骨格（左に見出し・右にイラスト・左下に URL）を避け、
       製図面の作法＝外周の二重枠と右下の表題欄に製品名・生地幅・URL を収める。
       app/theme.css の「製図台／型紙」というこの製品の顔を、色だけでなく
       レイアウトの骨格で言う。

     ■ SNS のタイムラインでは幅 500px 程度（縮小率 0.4167）に縮む。下限は2つある。
       和文（漢字）は 27px 以上＝実効 11.3px 以上。26px だと実効 10.8px で、
       画数の多い字（服・量・裁）が潰れる。
       ラテン字形だけの行（URL・数字のチップ）は 22px 以上＝実効 9.2px で読める。
       いずれの下限も割る装飾文字は置かない。

     ■ 焼き込んでよい具体値は生地幅の 90/110/140 だけで、これは lib/calc.mjs の
       FABRIC_WIDTHS と一致していなければならない（test/og.test.mjs が検査する）。
       用尺そのものの数値は寸法や係数を直すと黙ってズレるので画像には書かない。

     ■ このファイルを編集したら必ず上のコマンドで og.png を撮り直し、
       tools/og-source.sha256 を更新すること（test/og.test.mjs が未更新を検出する）。 -->
<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* app/theme.css の light 値 */
    --accent:hsl(224 58% 42%);
    --grid-line:hsl(224 50% 42% / 0.07);
    --fabric:hsl(36 34% 97%);
    --fabric-line:hsl(34 22% 84%);
    --piece-front:hsl(224 55% 42%);
    --piece-back:hsl(150 30% 34%);
    --piece-sleeve:hsl(32 68% 40%);
    --piece-accent:hsl(352 52% 44%);
    --bg:hsl(34 36% 99%);
    --text:hsl(34 14% 13%);
    --text-soft:hsl(34 10% 30%);
    --border:hsl(34 20% 88%);
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  }
  html,body{width:1200px;height:630px}
  body{
    background:var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:22px 22px;
    color:var(--text);font-family:var(--sans);
  }

  /* ── 図面枠（外周の二重枠） ── */
  .sheet{
    position:absolute;inset:16px;border:2px solid var(--text);padding:22px 26px 24px;
  }
  .sheet::before{
    content:"";position:absolute;inset:6px;border:1px solid var(--border);pointer-events:none;
  }

  /* ── 反物（裁断レイアウト）: 図面の field に据える ── */
  .bolt{
    position:relative;height:242px;background:var(--fabric);
    border:2px dashed var(--fabric-line); /* 裁ち線 */
    padding:30px 18px 18px;display:flex;align-items:stretch;gap:14px;
  }
  /* わ（折り山）= 二つ折りの山。パーツの上辺に接する（製品の LayoutFigure と同じ）。 */
  .wa{
    position:absolute;left:18px;right:18px;top:29px;border-top:2px dashed var(--accent);
  }
  .wa span{
    position:absolute;left:0;top:-30px;background:var(--fabric);padding:0 8px;
    font-family:var(--mincho);font-size:25px;color:var(--accent);line-height:1;
  }
  .piece{
    border:2.5px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);
    /* ラベルは中立色。色→意味は枠線と塗りが担う（製品の LayoutFigure と同じ設計） */
    display:grid;place-items:center;font-size:27px;color:var(--text);letter-spacing:.06em;
  }
  .p-front{--c:var(--piece-front);flex:2.1}
  .p-back{--c:var(--piece-back);flex:2}
  .p-sleeve{--c:var(--piece-sleeve);flex:1.2}
  .p-facing{--c:var(--piece-accent);flex:.55} /* 細い茜のストリップ・ラベルなし */

  /* ── 寸法線（用尺） ── */
  .dim{margin-top:16px;display:flex;align-items:center;gap:14px;color:var(--accent)}
  .dim .bar{flex:1;height:2px;background:currentColor;position:relative}
  .dim .bar::before,.dim .bar::after{
    content:"";position:absolute;top:-6px;width:2px;height:14px;background:currentColor;
  }
  .dim .bar::before{left:0}
  .dim .bar::after{right:0}
  .dim .txt{font-family:var(--mincho);font-size:30px;letter-spacing:.14em;line-height:1}

  /* ── 注記（図面の余白に書く一言）: 左下に置き、表題欄と同じ底辺で揃える ── */
  .note{
    position:absolute;left:26px;bottom:14px;width:498px;
    font-family:var(--mincho);font-size:40px;line-height:1.36;letter-spacing:.02em;
  }
  .note b{color:var(--accent);font-weight:600}

  /* ── 表題欄（タイトルブロック）: 内枠の右下隅に罫を共有して納める ── */
  .block{
    position:absolute;right:6px;bottom:6px;width:546px;
    border-left:2px solid var(--text);border-top:2px solid var(--text);
  }
  .block .row{display:flex;align-items:center;border-bottom:1px solid var(--border)}
  .block .row:last-child{border-bottom:0}
  .brand{gap:14px;padding:9px 16px}
  .seal{
    width:46px;height:46px;flex:none;border:2px solid var(--accent);border-radius:10px;
    display:grid;place-items:center;font-family:var(--mincho);font-size:28px;
    font-weight:700;color:var(--accent);
  }
  .brand h1{font-family:var(--mincho);font-size:41px;font-weight:600;letter-spacing:.04em;line-height:1}
  .brand h1 b{color:var(--accent);font-weight:600}
  /* 副題は「指定すると出る」を動詞で言う＝計算する道具だと絵だけで伝わるように。
     漢字は欧文より大きい下限が要る（500px 表示で 27px＝実効 11.3px）。 */
  .sub{padding:8px 16px;font-size:27px;color:var(--text-soft);letter-spacing:.01em}
  /* 「生地幅」「cm」を含むので和文の下限（27px）を当てる。チップの数字は
     ラテン字形なので 26px で読める。 */
  .widths{padding:8px 16px;gap:9px;font-size:27px;color:var(--text-soft)}
  .chip{
    border:1.5px solid var(--accent);color:var(--accent);border-radius:8px;
    padding:2px 11px;font-size:26px;font-weight:600;
  }
  .url{padding:7px 16px;font-size:22px;color:var(--text-soft);letter-spacing:.01em}
</style></head><body>
  <div class="sheet">

    <div class="bolt">
      <div class="wa"><span>わ</span></div>
      <div class="piece p-front">前身頃</div>
      <div class="piece p-back">後身頃</div>
      <div class="piece p-sleeve">袖</div>
      <div class="piece p-facing"></div>
    </div>

    <div class="dim"><span class="bar"></span><span class="txt">用尺</span><span class="bar"></span></div>

    <div class="note">布を買う前に、<br><b>必要な長さ</b>がわかる。</div>

    <div class="block">
      <div class="row brand">
        <div class="seal">尺</div>
        <h1>用<b>尺</b>カルク</h1>
      </div>
      <div class="row sub">種類と生地幅を選ぶと用尺が出ます</div>
      <div class="row widths">生地幅 <span class="chip">90</span><span class="chip">110</span><span class="chip">140</span> cm</div>
      <div class="row url">ga-project.github.io/yoshaku-calc</div>
    </div>

  </div>
</body></html>
